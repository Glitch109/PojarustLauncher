name: Build APK
on: [workflow_dispatch, push]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q PojarustLauncher.zip -d src_project
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: dtolnay/rust-toolchain@stable
        with: { targets: aarch64-linux-android }
      - run: cargo install cargo-ndk
      - name: Build Rust
        working-directory: src_project/PojarustLauncher/rust
        run: |
          export ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME
          cargo ndk -t arm64-v8a -o ../app/src/main/jniLibs build --release
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Build APK
        working-directory: src_project/PojarustLauncher
        run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: PojarustLauncher-apk
          path: src_project/PojarustLauncher/app/build/outputs/apk/release/*.apk
