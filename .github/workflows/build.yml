name: build-from-zip
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          GRADLEW=$(find work -name gradlew -not -path "*/node_modules/*" | head -n 1)
          PROJECT=$(dirname "$GRADLEW")
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --stacktrace --console=plain 2>&1 | tee build-log.txt
          exit ${PIPESTATUS[0]}

      - name: Collect errors
        if: failure()
        working-directory: ${{ env.PROJECT }}
        run: |
          grep -E "error:|FAILED|What went wrong" -A2 build-log.txt | head -2000 > build-errors.txt || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Artifacts
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
            ${{ env.PROJECT }}/build-log.txt
            ${{ env.PROJECT }}/build-errors.txt
          if-no-files-found: ignore
