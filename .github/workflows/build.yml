name: Build PojarustLauncher
on: [workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unzip project
        run: unzip -q PojarustLauncher.zip -d src_project
      - name: Fetch native submodules
        working-directory: src_project/PojarustLauncher
        run: |
          rm -rf app/src/main/cpp/preloader app/src/main/cpp/libHttpClient
          git clone --depth 1 https://github.com/LiteLDev/preloader-android app/src/main/cpp/preloader
          git clone --recursive https://github.com/microsoft/libHttpClient app/src/main/cpp/libHttpClient
      - name: Placeholder google-services.json
        working-directory: src_project/PojarustLauncher
        run: |
          cat > app/google-services.json <<'JSON'
          {"project_info":{"project_number":"000000000000","project_id":"ci-placeholder","storage_bucket":"ci-placeholder.appspot.com"},
           "client":[{"client_info":{"mobilesdk_app_id":"1:000000000000:android:0000000000000000000000","android_client_info":{"package_name":"dev.pojarust.launcher"}},
           "oauth_client":[],"api_key":[{"current_key":"AIzaSyCIOnlyPlaceholderKey"}],
           "services":{"appinvite_service":{"other_platform_oauth_client":[]}}}],"configuration_version":"1"}
          JSON
      - uses: actions/setup-java@v4
        with: { java-version: "21", distribution: temurin }
      - uses: android-actions/setup-android@v3
        with: { packages: platform-tools }
      - run: yes | sdkmanager --licenses; sdkmanager "build-tools;35.0.0"
      - uses: xmake-io/github-action-setup-xmake@v1
        with: { xmake-version: "2.9.9" }
      - uses: nttld/setup-ndk@v1
        with: { ndk-version: r28c, link-to-sdk: true }
      - name: Build Discord stub
        working-directory: src_project/PojarustLauncher
        run: |
          $ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android28-clang -shared -fPIC -O1 -Wl,-soname,libdiscord_partner_sdk.so -o app/src/main/jniLibs/arm64-v8a/libdiscord_partner_sdk.so tools/discord_stub.c
      - name: Build
        working-directory: src_project/PojarustLauncher
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease
      - name: Sign with testkey
        working-directory: src_project/PojarustLauncher
        run: |
          wget -q -O testkey.pk8 https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.pk8
          wget -q -O testkey.x509.pem https://raw.githubusercontent.com/aosp-mirror/platform_build/master/target/product/security/testkey.x509.pem
          sudo apt-get install -y apksigner
          APK_IN=$(find app/build/outputs/apk/release -name "*.apk" | head -1)
          apksigner sign --key testkey.pk8 --cert testkey.x509.pem --out PojarustLauncher.apk "$APK_IN"
      - uses: actions/upload-artifact@v4
        with:
          name: PojarustLauncher-apk
          path: src_project/PojarustLauncher/PojarustLauncher.apk
