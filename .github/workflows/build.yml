name: build-from-zip
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'microsoft'

      - name: Unzip project
        run: |
          ZIP=$(ls -t *.zip | head -n 1)
          echo "Using $ZIP"
          mkdir -p work
          unzip -q "$ZIP" -d work
          GRADLEW=$(find work -name gradlew | head -n 1)
          echo "PROJECT=$(dirname "$GRADLEW")" >> $GITHUB_ENV

      - name: Build
        working-directory: ${{ env.PROJECT }}
        run: |
          chmod +x ./gradlew
          ./gradlew build --console=plain > build-log.txt 2>&1 || echo "FAILED" > failed.flag
          grep -nE "error:|What went wrong|Could not|Execution failed|^> " -A3 build-log.txt | head -150
          [ ! -f failed.flag ]

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Artifacts
          path: |
            ${{ env.PROJECT }}/build/libs/*.jar
            ${{ env.PROJECT }}/build-log.txt
          if-no-files-found: ignore
